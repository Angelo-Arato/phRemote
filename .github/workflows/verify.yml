name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install locked dependencies
        run: npm ci
      - name: Install the Electron runtime
        run: npm exec install-electron
      - name: Build native input helper
        run: npm run build:native
      - name: Compile Windows input helper without sending input
        if: runner.os == 'Windows'
        run: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File desktop/native/phremote-input-windows.ps1 -CheckPermissions
      - name: Install Linux preflight dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libx11-6 libxtst6 libxrandr2
      - name: Inspect Linux X11 helper in a virtual display without sending input
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 desktop/native/phremote-input-linux.py --check-permissions
      - name: Tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Package portable application
        run: npm run package
      - name: Upload portable development build
        uses: actions/upload-artifact@v4
        with:
          name: phRemote-${{ runner.os }}-${{ runner.arch }}
          path: dist/phRemote-*.tar.gz
          if-no-files-found: error
