# Native Node relay. Applying this Blueprint creates a paid web service and disk.
# Review the resources and current Render pricing before deploying it.
services:
  - type: web
    name: phremote-relay
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: node --check server/index.mjs
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PHREMOTE_HOST
        value: 0.0.0.0
      - key: PHREMOTE_PORT
        value: "10000"
      - key: PHREMOTE_STORE
        value: /var/data/phremote/devices.json
      - key: PHREMOTE_ALLOWED_ORIGINS
        value: ""
    disk:
      name: phremote-devices
      mountPath: /var/data/phremote
      sizeGB: 1
